[project]
name = "dojo-contracts"
version = "1.0.0"
description = "0rca Swarm Dojo - Algorand Smart Contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "algokit>=2.0.0",
    "algopy>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
